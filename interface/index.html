<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste python api</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="background">
  <div id="centralizar">
<form class="row g-3">
  <div class="col-12">
    <label for="inputAddress2" class="form-label">Nome</label>
    <input type="text" class="form-control" id="inputAddress2" placeholder="Insira o nome do produto ou componente">
  </div>
      <div class="col-md-4" id="divselect">
    <label for="inputState" class="form-label">Compontente Pai</label>
    <select id="inputState" class="form-select">
      <option selected>Nenhum (Novo Produto)</option>
      <option>...</option>
    </select>
  </div>
    <div class="col-md-6">
    <label for="inputEmail4" class="form-label">Quantidade</label>
    <input type="number" class="form-control" id="0" placeholder="1">
  </div>
  <div class="col-md-6">
    <label for="inputPassword4" class="form-label">Preço</label>
    <input type="number" class="form-control" min="0" placeholder="0,00">
  </div>
  <div class="col-12" id="botaoenviar">
    <button type="submit" class="btn btn-success">Cadastrar</button>
  </div>
</form>
</div>

<div id="listaitens">

<table class="table align-middle">
    <thead>
        <tr>
            <th style="width: 35%;">Item</th>
            <th style="width: 15%;">Quantidade</th>
            <th style="width: 15%;">Preço unitário</th>
            <th style="width: 15%;">Subtotal</th>
            <th style="width: 20%;" class="text-end">Ações</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>
                <button class="btn btn-sm btn-outline-secondary"
                        data-bs-toggle="collapse"
                        data-bs-target="#componentesCaneta">
                    Caneta
                </button>
            </td>

            <td>1</td>
            <td>R$ 2,50</td>
            <td>R$ 2,50</td>

            <td>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-primary btn-sm btn-editar">
                        Editar
                    </button>
                    <button type="button" class="btn btn-danger btn-sm btn-remover">
                        Remover
                    </button>
                </div>
            </td>
        </tr>

        <tr>
            <td colspan="5" class="p-0">
                <div class="collapse" id="componentesCaneta">
                    <table class="table table-sm mb-0">
                        <tbody>

                            <tr>
                                <td style="width: 35%;" class="ps-5">↳ Tinta</td>
                                <td style="width: 15%;">1</td>
                                <td style="width: 15%;">R$ 0,80</td>
                                <td style="width: 15%;">R$ 0,80</td>
                                <td style="width: 20%;">
                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="button" class="btn btn-primary btn-sm btn-editar">
                                            Editar
                                        </button>
                                        <button type="button" class="btn btn-danger btn-sm btn-remover">
                                            Remover
                                        </button>
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <td class="ps-5">↳ Corpo</td>
                                <td>1</td>
                                <td>R$ 1,00</td>
                                <td>R$ 1,00</td>
                                <td>
                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="button" class="btn btn-primary btn-sm btn-editar">
                                            Editar
                                        </button>
                                        <button type="button" class="btn btn-danger btn-sm btn-remover">
                                            Remover
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="ps-5">↳ Tampa</td>
                                <td>1</td>
                                <td>R$ 0,70</td>
                                <td>R$ 0,70</td>
                                <td>
                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="button" class="btn btn-primary btn-sm btn-editar">
                                            Editar
                                        </button>
                                        <button type="button" class="btn btn-danger btn-sm btn-remover">
                                            Remover
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </td>
        </tr>
    </tbody>
</table>


</div>
<div class="modal fade" id="modalEditar" tabindex="-1"
     aria-labelledby="modalEditarLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalEditarLabel">
                    Editar item
                </h5>

                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
            </div>

            <div class="modal-body">
                <form id="formEditar">

                    <div class="mb-3">
                        <label for="editarNome" class="form-label">Nome</label>
                        <input type="text" class="form-control"
                               id="editarNome" required>
                    </div>

                    <div class="mb-3">
                        <label for="editarQuantidade" class="form-label">
                            Quantidade
                        </label>
                        <input type="number" class="form-control"
                               id="editarQuantidade" min="1" required>
                    </div>

                    <div class="mb-3">
                        <label for="editarPreco" class="form-label">
                            Preço unitário
                        </label>
                        <input type="number" class="form-control"
                               id="editarPreco" min="0" step="0.01" required>
                    </div>

                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button type="submit" form="formEditar"
                        class="btn btn-primary">
                    Salvar alterações
                </button>
            </div>

        </div>
    </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
